name: Publish fixture

on:
  workflow_dispatch:
    inputs:
      fixture-version:
        description: Ordinary fixture version to submit or look up
        required: true
        default: 0.0.5-fixture.0
        type: string
      action-ref:
        description: Full releaseway/npm-actions candidate SHA; stable pin by default
        required: true
        default: 680948414bbe6bfe64e94f776c3514ad44f3dd69 # v0.5.1
        type: string
      version-source:
        description: Resolve fixture version from package metadata or npm-fixture-v tag
        required: true
        default: package-json
        type: choice
        options:
          - package-json
          - git-tag
      expected-state:
        description: Expected npm-actions package state
        required: true
        default: already-published
        type: choice
        options:
          - staged
          - already-published
      prepare-release:
        description: Prepare a release marker and publish from its tag in this same workflow; use git-tag and the planned fixture version.
        required: true
        default: false
        type: boolean

permissions:
  contents: write
  id-token: write

concurrency:
  group: npm-fixture-release
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - id: native
        name: Prepare fixture identity and metadata
        if: ${{ !inputs.prepare-release }}
        env:
          ACTION_REF: ${{ inputs.action-ref }}
          FIXTURE_VERSION: ${{ inputs.fixture-version }}
          VERSION_SOURCE: ${{ inputs.version-source }}
          FIXTURE_KIND: fixture
        run: python3 scripts/prepare.py

      - name: Checkout exact candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: releaseway/npm-actions
          ref: ${{ inputs.action-ref }}
          path: npm-action
          persist-credentials: false

      - name: Verify checked-out candidate identity
        env:
          ACTION_REF: ${{ inputs.action-ref }}
        run: test "$(git -C npm-action rev-parse HEAD)" = "${ACTION_REF,,}"

      - name: Validate prepared fixture request
        if: inputs.prepare-release
        env:
          VERSION_SOURCE: ${{ inputs.version-source }}
          EXPECTED_STATE: ${{ inputs.expected-state }}
        run: test "$VERSION_SOURCE" = git-tag && test "$EXPECTED_STATE" = staged

      - id: release
        name: Plan the next fixture release
        if: inputs.prepare-release
        uses: releaseway/actions/prepare@5841e545ff259790a3b2461299e741d62c69a73d # v0.4.1
        with:
          mode: plan
          prerelease-id: fixture

      - name: Verify planned fixture version
        if: inputs.prepare-release
        env:
          PLANNED_VERSION: ${{ steps.release.outputs.version }}
          FIXTURE_VERSION: ${{ inputs.fixture-version }}
        run: test "$PLANNED_VERSION" = "$FIXTURE_VERSION"

      - name: Execute the verified release plan
        if: inputs.prepare-release
        uses: releaseway/actions/prepare@5841e545ff259790a3b2461299e741d62c69a73d # v0.4.1
        with:
          mode: resume
          plan-path: ${{ steps.release.outputs.plan-path }}

      - id: npm
        uses: ./npm-action
        with:
          release-commit: ${{ steps.release.outputs.commit }}

      - id: evidence
        name: Verify publication result and preserve candidate evidence
        env:
          PACKAGES: ${{ steps.npm.outputs.packages }}
          REPORT_PATH: ${{ steps.npm.outputs.report-path }}
          EXPECTED_STATE: ${{ inputs.expected-state }}
          FIXTURE_VERSION: ${{ inputs.fixture-version }}
          ACTION_REF: ${{ inputs.action-ref }}
          VERSION_SOURCE: ${{ inputs.version-source }}
          WORKFLOW_FILE: publish.yml
          SCENARIO: npm-stage
          RELEASE_COMMIT: ${{ steps.release.outputs.commit }}
        run: python3 scripts/evidence.py

      - name: Summary
        env:
          PACKAGES: ${{ steps.npm.outputs.packages }}
        shell: bash
        run: |
          echo "npm-actions fixture result: $PACKAGES" >> "$GITHUB_STEP_SUMMARY"

      - name: Upload candidate acceptance evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: releaseway-acceptance-${{ github.run_attempt }}
          path: acceptance.json
          retention-days: 30
          if-no-files-found: error
