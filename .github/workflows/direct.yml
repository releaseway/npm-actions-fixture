name: Publish fixture directly

on:
  workflow_dispatch:
    inputs:
      expected-state:
        description: Expected npm-actions package state
        required: true
        default: published
        type: choice
        options:
          - published
          - existing

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Opt into direct mode for this fixture run
        shell: bash
        run: |
          cat > .github/npm/packages.yml <<'YAML'
          schema: 1

          publish:
            mode: direct
          YAML

      - id: npm
        uses: releaseway/npm-actions@bea4e3875fa6423165aed3a20fcd58499c4d6b64 # v0.1.5

      - name: Verify result
        env:
          PACKAGES: ${{ steps.npm.outputs.packages }}
          EXPECTED_STATE: ${{ inputs.expected-state }}
        shell: bash
        run: |
          set -euo pipefail
          version="$(jq -r .version package.json)"
          jq -e             --arg name '@releaseway/npm-actions-fixture'             --arg version "$version"             --arg state "$EXPECTED_STATE"             'length == 1 and .[0].name == $name and .[0].version == $version and .[0].state == $state'             <<<"$PACKAGES" >/dev/null

      - name: Summary
        env:
          PACKAGES: ${{ steps.npm.outputs.packages }}
        shell: bash
        run: |
          echo "npm-actions direct fixture result: $PACKAGES" >> "$GITHUB_STEP_SUMMARY"
