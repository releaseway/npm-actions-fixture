name: Publish native fixture directly

on:
  workflow_dispatch:
    inputs:
      fixture-version:
        description: Native fixture version to publish or reconcile
        required: true
        default: 0.0.6-native.0
        type: string
      action-ref:
        description: Full releaseway/npm-actions candidate SHA; stable pin by default
        required: true
        default: 269fbdeac83fed2df2880915726ed91edbe1bbdd # v0.4.0
        type: string
      version-source:
        description: Resolve fixture version from package metadata or npm-fixture-v tag
        required: true
        default: package-json
        type: choice
        options:
          - package-json
          - git-tag
      expected-state:
        description: Expected npm-actions package state
        required: true
        default: already-published
        type: choice
        options:
          - published
          - already-published

permissions:
  contents: write
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"

      - id: native
        name: Prepare fixture identity and metadata
        env:
          ACTION_REF: ${{ inputs.action-ref }}
          FIXTURE_VERSION: ${{ inputs.fixture-version }}
          VERSION_SOURCE: ${{ inputs.version-source }}
          FIXTURE_KIND: native
        run: python3 scripts/prepare.py

      - name: Checkout exact candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: releaseway/npm-actions
          ref: ${{ inputs.action-ref }}
          path: npm-action
          persist-credentials: false

      - name: Verify checked-out candidate identity
        env:
          ACTION_REF: ${{ inputs.action-ref }}
        run: test "$(git -C npm-action rev-parse HEAD)" = "${ACTION_REF,,}"

      - name: Create or reuse immutable native Release
        if: inputs.expected-state == 'published'
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.native.outputs.tag }}
          ASSET_NAME: ${{ steps.native.outputs.asset }}
        shell: bash
        run: |
          set -euo pipefail

          asset="$RUNNER_TEMP/$ASSET_NAME"

          build_asset() {
            local root="$RUNNER_TEMP/native-asset"
            rm -rf "$root"
            mkdir -p "$root/bin"
            cp native/fixture.sh "$root/bin/npm-actions-native-fixture"
            chmod 0755 "$root/bin/npm-actions-native-fixture"
            tar \
              --sort=name \
              --mtime='@0' \
              --owner=0 \
              --group=0 \
              --numeric-owner \
              -czf "$asset" \
              -C "$root" \
              bin
          }

          if gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            git fetch --force origin "refs/tags/$RELEASE_TAG:refs/tags/$RELEASE_TAG"
            release_commit="$(git rev-parse "$RELEASE_TAG^{commit}")"
            test "$release_commit" = "$GITHUB_SHA" || {
              echo "existing Release tag resolves to $release_commit, expected $GITHUB_SHA" >&2
              exit 1
            }

            is_draft="$(gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --json isDraft --jq .isDraft)"
            if [ "$is_draft" = "true" ]; then
              build_asset
              if ! gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets[].name' | grep -Fx "$ASSET_NAME" >/dev/null; then
                gh release upload "$RELEASE_TAG" "$asset" --repo "$GITHUB_REPOSITORY"
              fi
              gh release edit "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --draft=false
            fi
          else
            build_asset
            gh release create "$RELEASE_TAG" \
              "$asset#Linux x64 native fixture" \
              --repo "$GITHUB_REPOSITORY" \
              --target "$GITHUB_SHA" \
              --title "$RELEASE_TAG" \
              --notes "Permanent npm-actions native integration fixture." \
              --draft
            gh release edit "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --draft=false
          fi

          ready=false
          for _ in $(seq 1 30); do
            release_json="$(gh api \
              -H 'Accept: application/vnd.github+json' \
              -H 'X-GitHub-Api-Version: 2026-03-10' \
              "repos/$GITHUB_REPOSITORY/releases/tags/$RELEASE_TAG")"

            if jq -e \
              --arg asset "$ASSET_NAME" \
              '.draft == false and .immutable == true and
               ([.assets[] |
                 select(
                   .name == $asset and
                   .state == "uploaded" and
                   (.digest | type == "string" and startswith("sha256:"))
                 )
               ] | length == 1)' \
              <<<"$release_json" >/dev/null; then
              ready=true
              break
            fi
            sleep 2
          done

          test "$ready" = "true" || {
            echo "native Release did not become immutable with a SHA-256 asset digest" >&2
            exit 1
          }

      - id: npm
        uses: ./npm-action
        env:
          NPM_CONFIG_REGISTRY: https://registry.npmjs.org/

      - id: evidence
        name: Verify publication result and preserve candidate evidence
        env:
          PACKAGES: ${{ steps.npm.outputs.packages }}
          REPORT_PATH: ${{ steps.npm.outputs.report-path }}
          EXPECTED_STATE: ${{ inputs.expected-state }}
          FIXTURE_VERSION: ${{ inputs.fixture-version }}
          ACTION_REF: ${{ inputs.action-ref }}
          VERSION_SOURCE: ${{ inputs.version-source }}
          WORKFLOW_FILE: direct.yml
          SCENARIO: npm-direct
        run: python3 scripts/evidence.py

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"

      - name: Install and execute native CLI on Node 22
        env:
          FIXTURE_VERSION: ${{ inputs.fixture-version }}
          EXPECTED_INTEGRITY: ${{ steps.evidence.outputs.integrity }}
          XDG_CACHE_HOME: ${{ runner.temp }}/native-cache-22-${{ github.run_attempt }}
        run: bash scripts/verify-native.sh

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"

      - name: Install and execute native CLI on Node 24
        env:
          FIXTURE_VERSION: ${{ inputs.fixture-version }}
          EXPECTED_INTEGRITY: ${{ steps.evidence.outputs.integrity }}
          XDG_CACHE_HOME: ${{ runner.temp }}/native-cache-24-${{ github.run_attempt }}
        run: bash scripts/verify-native.sh

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "26"

      - name: Install and execute native CLI on Node 26
        env:
          FIXTURE_VERSION: ${{ inputs.fixture-version }}
          EXPECTED_INTEGRITY: ${{ steps.evidence.outputs.integrity }}
          XDG_CACHE_HOME: ${{ runner.temp }}/native-cache-26-${{ github.run_attempt }}
        run: bash scripts/verify-native.sh

      - name: Record verified consumer runtimes
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          p = Path('acceptance.json')
          evidence = json.loads(p.read_text())
          evidence['installed_node_versions'] = ['22', '24', '26']
          p.write_text(json.dumps(evidence, indent=2) + '\n')
          PY

      - name: Summary
        env:
          PACKAGES: ${{ steps.npm.outputs.packages }}
          RELEASE_TAG: ${{ steps.native.outputs.tag }}
        shell: bash
        run: |
          {
            echo "npm-actions native fixture result: $PACKAGES"
            echo "native Release: $RELEASE_TAG"
            echo "installed CLI: first-run + read-only cache-hit verified"
          } >>"$GITHUB_STEP_SUMMARY"

      - name: Upload candidate acceptance evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: releaseway-acceptance-${{ github.run_attempt }}
          path: acceptance.json
          retention-days: 30
          if-no-files-found: error
