name: Publish native fixture directly

on:
  workflow_dispatch:
    inputs:
      fixture-version:
        description: Native fixture version to publish or reconcile
        required: true
        default: 0.0.13-native.0
        type: string
      action-ref:
        description: Full releaseway/npm-actions candidate SHA; stable pin by default
        required: true
        default: 614f72ae0c6482f87a1f68f8222e42da0b2b82cb # v0.7.0
        type: string
      command-aliases:
        description: Verify additional command names from a newly published alias fixture
        type: boolean
        default: true
      version-source:
        description: Resolve fixture version from package metadata or npm-fixture-v tag
        required: true
        default: package-json
        type: choice
        options:
          - package-json
          - git-tag
      expected-state:
        description: Expected npm-actions package state
        required: true
        default: already-published
        type: choice
        options:
          - published
          - already-published
      app-free:
        description: Exercise source-tag rc/stable and explicit npm selection
        type: boolean
        default: false
      actions-ref:
        description: Full actions candidate SHA for app-free mode
        type: string
        default: ""
      rc-tag:
        description: Existing app-free tag for explicit reconciliation; supply both
        type: string
        default: ""
      stable-tag:
        description: Existing app-free tag for explicit reconciliation; supply both
        type: string
        default: ""

permissions:
  contents: write
  id-token: write

concurrency:
  group: npm-fixture-release
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 12.14.0
          run_install: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"

      - run: pnpm install --frozen-lockfile

      - id: native
        name: Prepare fixture identity and metadata
        env:
          ACTION_REF: ${{ inputs.action-ref }}
          FIXTURE_VERSION: ${{ inputs.fixture-version }}
          VERSION_SOURCE: ${{ inputs.version-source }}
          FIXTURE_KIND: native
          COMMAND_ALIASES: ${{ inputs.command-aliases }}
        run: python3 scripts/prepare.py

      - name: Checkout exact candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: releaseway/npm-actions
          ref: ${{ inputs.action-ref }}
          path: npm-action
          persist-credentials: false

      - name: Verify checked-out candidate identity
        env:
          ACTION_REF: ${{ inputs.action-ref }}
        run: test "$(git -C npm-action rev-parse HEAD)" = "${ACTION_REF,,}"

      - name: Build deterministic native fixture asset
        if: inputs.expected-state == 'published'
        env:
          ASSET_NAME: ${{ steps.native.outputs.asset }}
        shell: bash
        run: |
          set -euo pipefail

          asset="$RUNNER_TEMP/$ASSET_NAME"

          root="$RUNNER_TEMP/native-asset"
          mkdir -p "$root/bin"
          cp native/fixture.sh "$root/bin/npm-actions-native-fixture"
          chmod 0755 "$root/bin/npm-actions-native-fixture"
          tar --sort=name --mtime='@0' --owner=0 --group=0 --numeric-owner \
            -czf "$asset" -C "$root" bin

      - name: Bind native release tag
        if: inputs.expected-state == 'published'
        uses: releaseway/actions/prepare@804562f2eb9d7662810298835f7339bd6f26fcfa # v0.6.0
        with:
          mode: tag
          tag: ${{ steps.native.outputs.tag }}
          commit: ${{ github.sha }}

      - name: Publish or resume immutable native release
        if: inputs.expected-state == 'published'
        uses: releaseway/actions@804562f2eb9d7662810298835f7339bd6f26fcfa # v0.6.0
        with:
          tag: ${{ steps.native.outputs.tag }}
          commit: ${{ github.sha }}
          assets: ${{ runner.temp }}/${{ steps.native.outputs.asset }}
          notes: none
          prerelease: "true"
          latest: "false"

      - id: npm
        uses: ./npm-action
        env:
          NPM_CONFIG_REGISTRY: https://registry.npmjs.org/

      - id: evidence
        name: Verify publication result and preserve candidate evidence
        env:
          PACKAGES: ${{ steps.npm.outputs.packages }}
          REPORT_PATH: ${{ steps.npm.outputs.report-path }}
          EXPECTED_STATE: ${{ inputs.expected-state }}
          FIXTURE_VERSION: ${{ inputs.fixture-version }}
          ACTION_REF: ${{ inputs.action-ref }}
          VERSION_SOURCE: ${{ inputs.version-source }}
          WORKFLOW_FILE: direct.yml
          SCENARIO: npm-direct
        run: python3 scripts/evidence.py

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"

      - name: Install and execute native CLI on Node 22
        env:
          FIXTURE_VERSION: ${{ inputs.fixture-version }}
          EXPECTED_INTEGRITY: ${{ steps.evidence.outputs.integrity }}
          COMMAND_ALIASES: ${{ inputs.command-aliases }}
          XDG_CACHE_HOME: ${{ runner.temp }}/native-cache-22-${{ github.run_attempt }}
        run: bash scripts/verify-native.sh

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"

      - name: Install and execute native CLI on Node 24
        env:
          FIXTURE_VERSION: ${{ inputs.fixture-version }}
          EXPECTED_INTEGRITY: ${{ steps.evidence.outputs.integrity }}
          COMMAND_ALIASES: ${{ inputs.command-aliases }}
          XDG_CACHE_HOME: ${{ runner.temp }}/native-cache-24-${{ github.run_attempt }}
        run: bash scripts/verify-native.sh

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "26"

      - name: Install and execute native CLI on Node 26
        env:
          FIXTURE_VERSION: ${{ inputs.fixture-version }}
          EXPECTED_INTEGRITY: ${{ steps.evidence.outputs.integrity }}
          COMMAND_ALIASES: ${{ inputs.command-aliases }}
          XDG_CACHE_HOME: ${{ runner.temp }}/native-cache-26-${{ github.run_attempt }}
        run: bash scripts/verify-native.sh

      - name: Record verified consumer runtimes
        env:
          COMMAND_ALIASES: ${{ inputs.command-aliases }}
        run: |
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          p = Path('acceptance.json')
          evidence = json.loads(p.read_text())
          evidence['installed_node_versions'] = ['22', '24', '26']
          evidence['command_aliases'] = ['rw-npm-fixture'] if os.environ['COMMAND_ALIASES'] == 'true' else []
          p.write_text(json.dumps(evidence, indent=2) + '\n')
          PY

      - name: Summary
        env:
          PACKAGES: ${{ steps.npm.outputs.packages }}
          RELEASE_TAG: ${{ steps.native.outputs.tag }}
        shell: bash
        run: |
          {
            echo "npm-actions native fixture result: $PACKAGES"
            echo "native Release: $RELEASE_TAG"
            echo "installed CLI: first-run + read-only cache-hit verified"
          } >>"$GITHUB_STEP_SUMMARY"

      - name: Upload candidate acceptance evidence
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: releaseway-acceptance-${{ github.run_attempt }}
          path: acceptance.json
          retention-days: 30
          if-no-files-found: error
    if: ${{ !inputs.app-free }}
  app-free:
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      id-token: write
    outputs:
      tag: ${{ steps.stable-plan.outputs.tag || steps.stable-resolve.outputs.tag }}
      version: ${{ steps.stable-plan.outputs.version ||
        steps.stable-resolve.outputs.version }}
      commit: ${{ github.sha }}
      evidence-id: ${{ steps.evidence.outputs.artifact-id }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: "24"
      - name: Validate fixture and exact candidates
        env:
          ACTIONS_REF: ${{ inputs.actions-ref }}
          NPM_REF: ${{ inputs.action-ref }}
          RC_TAG: ${{ inputs.rc-tag }}
          STABLE_TAG: ${{ inputs.stable-tag }}
        run: python3 scripts/app-free.py validate
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: releaseway/actions
          ref: ${{ inputs.actions-ref }}
          path: release-action
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: releaseway/npm-actions
          ref: ${{ inputs.action-ref }}
          path: npm-action
          persist-credentials: false
      - name: Verify candidate checkout identities before writes
        env:
          ACTIONS_REF: ${{ inputs.actions-ref }}
          NPM_REF: ${{ inputs.action-ref }}
        run: |-
          test "$(git -C release-action rev-parse HEAD)" = "$ACTIONS_REF"
          test "$(git -C npm-action rev-parse HEAD)" = "$NPM_REF"
      - id: rc-plan
        if: ${{ inputs.rc-tag == '' }}
        uses: ./release-action/prepare
        with:
          mode: plan
          release-config: .github/app-free.yml
          prerelease-id: rc
          plan-path: ${{ format('{0}/rc-plan.json', runner.temp) }}
      - id: rc-resolve
        if: ${{ inputs.rc-tag != '' }}
        uses: ./release-action/prepare
        with:
          mode: resolve
          tag: ${{ inputs.rc-tag }}
          commit: ${{ github.sha }}
          allow-prerelease: "true"
          tag-prefix: app-free-v
      - name: Build exact rc assets
        env:
          VERSION: ${{ steps.rc-plan.outputs.version || steps.rc-resolve.outputs.version
            }}
          DEST: ${{ format('{0}/app-free-rc', runner.temp) }}
        run: python3 scripts/app-free.py build "$VERSION" "$DEST" native
      - id: rc-bind
        if: ${{ inputs.rc-tag == '' }}
        uses: ./release-action/prepare
        with:
          mode: resume
          release-config: .github/app-free.yml
          plan-path: ${{ format('{0}/rc-plan.json', runner.temp) }}
      - id: rc-release
        uses: ./release-action
        with:
          tag: ${{ steps.rc-plan.outputs.tag || steps.rc-resolve.outputs.tag }}
          commit: ${{ github.sha }}
          assets: ${{ format('{0}/app-free-rc/*', runner.temp) }}
          notes: none
          prerelease: "true"
          latest: "false"
      - id: stable-plan
        if: ${{ inputs.stable-tag == '' }}
        uses: ./release-action/prepare
        with:
          mode: plan
          release-config: .github/app-free.yml
          prerelease-id: ""
          plan-path: ${{ format('{0}/stable-plan.json', runner.temp) }}
      - id: stable-resolve
        if: ${{ inputs.stable-tag != '' }}
        uses: ./release-action/prepare
        with:
          mode: resolve
          tag: ${{ inputs.stable-tag }}
          commit: ${{ github.sha }}
          allow-prerelease: "false"
          tag-prefix: app-free-v
      - name: Build exact stable assets
        env:
          VERSION: ${{ steps.stable-plan.outputs.version ||
            steps.stable-resolve.outputs.version }}
          DEST: ${{ format('{0}/app-free-stable', runner.temp) }}
        run: python3 scripts/app-free.py build "$VERSION" "$DEST" native
      - id: stable-bind
        if: ${{ inputs.stable-tag == '' }}
        uses: ./release-action/prepare
        with:
          mode: resume
          release-config: .github/app-free.yml
          plan-path: ${{ format('{0}/stable-plan.json', runner.temp) }}
      - id: stable-release
        uses: ./release-action
        with:
          tag: ${{ steps.stable-plan.outputs.tag || steps.stable-resolve.outputs.tag }}
          commit: ${{ github.sha }}
          assets: ${{ format('{0}/app-free-stable/*', runner.temp) }}
          notes: none
          prerelease: "false"
          latest: "false"
      - name: Prepare fixture-only npm metadata after clean-source tag creation
        run: python3 scripts/app-free.py package
      - id: rc-npm
        uses: ./npm-action
        with:
          release-tag: ${{ steps.rc-plan.outputs.tag || steps.rc-resolve.outputs.tag }}
      - id: stable-npm
        uses: ./npm-action
        with:
          release-tag: ${{ steps.stable-plan.outputs.tag ||
            steps.stable-resolve.outputs.tag }}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: "22"
      - name: Install both versions and run native commands on Node 22
        env:
          RC_VERSION: ${{ steps.rc-plan.outputs.version ||
            steps.rc-resolve.outputs.version }}
          STABLE_VERSION: ${{ steps.stable-plan.outputs.version ||
            steps.stable-resolve.outputs.version }}
          RC_REPORT: ${{ steps.rc-npm.outputs.report-path }}
          STABLE_REPORT: ${{ steps.stable-npm.outputs.report-path }}
        run: bash scripts/app-free-consumer.sh
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: "24"
      - name: Install both versions and run native commands on Node 24
        env:
          RC_VERSION: ${{ steps.rc-plan.outputs.version ||
            steps.rc-resolve.outputs.version }}
          STABLE_VERSION: ${{ steps.stable-plan.outputs.version ||
            steps.stable-resolve.outputs.version }}
          RC_REPORT: ${{ steps.rc-npm.outputs.report-path }}
          STABLE_REPORT: ${{ steps.stable-npm.outputs.report-path }}
        run: bash scripts/app-free-consumer.sh
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: "26"
      - name: Install both versions and run native commands on Node 26
        env:
          RC_VERSION: ${{ steps.rc-plan.outputs.version ||
            steps.rc-resolve.outputs.version }}
          STABLE_VERSION: ${{ steps.stable-plan.outputs.version ||
            steps.stable-resolve.outputs.version }}
          RC_REPORT: ${{ steps.rc-npm.outputs.report-path }}
          STABLE_REPORT: ${{ steps.stable-npm.outputs.report-path }}
        run: bash scripts/app-free-consumer.sh
      - name: Bind current-attempt evidence to real results
        env:
          ACTIONS_REF: ${{ inputs.actions-ref }}
          NPM_REF: ${{ inputs.action-ref }}
          RC_TAG: ${{ steps.rc-plan.outputs.tag || steps.rc-resolve.outputs.tag }}
          RC_VERSION: ${{ steps.rc-plan.outputs.version ||
            steps.rc-resolve.outputs.version }}
          RC_PACKAGES: ${{ steps.rc-npm.outputs.packages }}
          RC_REPORT: ${{ steps.rc-npm.outputs.report-path }}
          STABLE_TAG: ${{ steps.stable-plan.outputs.tag ||
            steps.stable-resolve.outputs.tag }}
          STABLE_VERSION: ${{ steps.stable-plan.outputs.version ||
            steps.stable-resolve.outputs.version }}
          STABLE_PACKAGES: ${{ steps.stable-npm.outputs.packages }}
          STABLE_REPORT: ${{ steps.stable-npm.outputs.report-path }}
        run: python3 scripts/app-free.py collect npm
      - id: evidence
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: app-free-acceptance-${{ github.run_attempt }}
          path: app-free-acceptance.json
          if-no-files-found: error
          retention-days: 30
    if: ${{ inputs.app-free }}
