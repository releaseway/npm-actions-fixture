name: Bootstrap npm fixture

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  bootstrap:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          registry-url: https://registry.npmjs.org/
          scope: "@releaseway"

      - name: Publish bootstrap version when absent
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_BOOTSTRAP_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          package='@releaseway/npm-actions-fixture@0.0.1-fixture.0'
          if npm view "$package" version --registry=https://registry.npmjs.org/ >/dev/null 2>&1; then
            echo "Bootstrap version already exists."
          else
            npm publish --access public --tag fixture
          fi

      - name: Verify bootstrap package is public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_BOOTSTRAP_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          package='@releaseway/npm-actions-fixture@0.0.1-fixture.0'
          test "$(npm view "$package" version --registry=https://registry.npmjs.org/)" = '0.0.1-fixture.0'
          env -u NODE_AUTH_TOKEN npm view "$package" version --registry=https://registry.npmjs.org/ >/dev/null
